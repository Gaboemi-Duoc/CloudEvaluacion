name: Deploy Spring Boot to EC2 via GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gaboemi-duoc/cloudevaluacion
  CONTAINER_NAME: cloud-evaluacion
  APP_DIR: /home/ec2-user/cloud-evaluacion

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. JDK 21 + Gradle cache scoped to bff/
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
          cache-dependency-path: "bff/**/*.gradle*"

      # 2. Build the BFF from bff/
      - name: Build with Gradle
        working-directory: ./bff
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      # 3. GHCR login (same as before)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build & push using bff/ as context
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./bff
          file: ./bff/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 5a. Ensure APP_DIR exists on the EC2 (must run before scp)
      - name: Ensure app dir on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ${{ env.APP_DIR }}

      # 5b. Copy kafka/ to EC2, flattening the leading "kafka/" segment
      #     Result: $APP_DIR/docker-compose.yml, $APP_DIR/kafka/init-topics.sh
      - name: Copy kafka to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "kafka/**"
          target: ${{ env.APP_DIR }}
          strip_components: 1
          overwrite: true

      # 5c. Deploy: write .env, bring stack up with compose, init topics
      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # Whitelist what lands in the remote shell
          envs: APP_DIR,CONTAINER_NAME,GH_CR_PAT,GITHUB_ACTOR,REGISTRY,IMAGE_NAME,PUBLIC_HOST_URL,API_GATEWAY_SECRET,COGNITO_ISSUER_URI,DB_URL,DB_USER,DB_PASSWORD
          script: |
            set -e

            # --- SWAP (idempotent) ---
            if [ ! -f /swapfile ]; then
              echo "Creating 2GB swap..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # --- DOCKER (idempotent) ---
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            # --- COMPOSE PLUGIN (idempotent) ---
            if ! sudo docker compose version &> /dev/null; then
              echo "Installing docker-compose-plugin..."
              sudo dnf install -y docker-compose-plugin
            fi

            # --- PRIVATE IP for Kafka EXTERNAL advertised listener ---
            EC2_PRIVATE_IP=$(hostname -I | awk '{print $1}')
            echo "EC2 private IP = $EC2_PRIVATE_IP"

            cd "$APP_DIR"

            # --- WRITE .env (values come from GitHub Secrets, expanded remotely) ---
            cat > .env <<EOF
            EC2_PRIVATE_IP=${EC2_PRIVATE_IP}
            PUBLIC_HOST_URL=${PUBLIC_HOST_URL}
            API_GATEWAY_SECRET=${API_GATEWAY_SECRET}
            COGNITO_ISSUER_URI=${COGNITO_ISSUER_URI}
            DB_URL=${DB_URL}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            EOF

            chmod +x kafka/init-topics.sh || true

            # --- BRING STACK UP ---
            sg docker -c "
              set -e
              echo '$GH_CR_PAT' | docker login $REGISTRY -u $GITHUB_ACTOR --password-stdin

              # One-time cleanup of the legacy 'docker run' container (pre-compose migration)
              docker rm -f $CONTAINER_NAME >/dev/null 2>&1 || true

              cd $APP_DIR
              docker compose pull
              docker compose up -d --remove-orphans
              docker compose ps
            "

            # --- INIT TOPICS (idempotent, tolerates 'already exists') ---
            bash kafka/init-topics.sh || true

            # --- POST-DEPLOY STATUS ---
            echo "--- Container status ---"
            sudo docker ps --filter "name=kafka" --filter "name=$CONTAINER_NAME" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
        env:
          APP_DIR: ${{ env.APP_DIR }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          GH_CR_PAT: ${{ secrets.GH_CR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          PUBLIC_HOST_URL: http://${{ vars.TARGET_HOST_IP }}
          API_GATEWAY_SECRET: ${{ secrets.API_GATEWAY_SECRET }}
          COGNITO_ISSUER_URI: ${{ secrets.COGNITO_ISSUER_URI }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}