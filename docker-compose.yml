services:
  kafka:
    image: bitnami/kafka:3.9
    container_name: kafka
    ports:
      - "29092:29092"          # host-published listener; used by Lambda via EC2 private IP
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${EC2_PRIVATE_IP}:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cloud-evaluacion:
    image: ghcr.io/gaboemi-duoc/cloudevaluacion:latest
    container_name: cloud-evaluacion
    ports:
      - "80:8080"
    environment:
      PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092        # <-- same compose network
      PUBLIC_HOST_URL: ${PUBLIC_HOST_URL}
      API_GATEWAY_SECRET: ${API_GATEWAY_SECRET}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # SNS_TOPIC_ARN is gone
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped