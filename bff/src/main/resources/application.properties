spring.application.name=CloudEvaluacion

server.port=${PORT:8080}
app.public-host=${PUBLIC_HOST_URL:http://localhost:8080}
app.gateway.secret=${API_GATEWAY_SECRET:secreto_local}

# ---------- Cognito (IDaaS) ----------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_NN6vjj3k5}

# ---------- Kafka ----------
# Use `kafka:9092` if the BFF runs inside the same docker-compose network as the broker.
# Use `localhost:29092` (or the EC2 host IP) if the BFF runs on the EC2 host via `bootRun` / systemd.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Topic names (also consumed in code via @Value)
app.kafka.topic.commands=${KAFKA_COMMANDS_TOPIC:cloud-commands}

logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.security=INFO